services:
  bridge:
    image: ghcr.io/gavinguler/ambilight-hue-bridge:latest
    # build: .            # or build it yourself
    container_name: ambilight-hue-bridge
    restart: unless-stopped
    network_mode: host    # needed for Apple TV discovery (mDNS); the API listens on :8765
    volumes:
      - ./data:/data
